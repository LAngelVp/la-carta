<div>
    <div class="flex gap-2 w-full justify-center items-center pb-[50px]">
        @for (item of botones; track $index) {
            <button class="animate-on-scroll bg-gray-300 p-2 rounded font-bold text-white text-lg transition-all duration-300 hover:cursor-pointer hover:-translate-y-1 hover:shadow-2xl focus:bg-green-800 fontBBH tracking-widest"
            (click)="obtenerNombreBoton(item)">
                {{item | uppercase}}
            </button>
        }
    </div>
</div>
